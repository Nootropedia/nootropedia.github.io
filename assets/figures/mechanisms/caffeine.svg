<svg xmlns='http://www.w3.org/2000/svg' font-family='Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif' viewBox='0 0 760 548' role='img' aria-label='Caffeine blocks adenosine receptors, lifting a brake on neurons' font-size='13'><style>.still{display:none}@media (prefers-reduced-motion: reduce){.anim{display:none}.still{display:inline}}</style><defs><marker id='arr' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2f6fdb'/></marker></defs><rect x='0' y='0' width='760' height='548' rx='12' fill='#ffffff'/><text x='24' y='30' font-size='15' fill='#1d1d1b' font-weight='600'>Caffeine blocks adenosine receptors, lifting a brake on neurons</text><text x='24' y='50' font-size='11.5' fill='#5c5c57'>Caffeine</text><g transform='translate(0,0)'><rect x='24' y='430' width='432' height='44' rx='22' fill='#cf3f3a' fill-opacity='0.08' stroke='#cf3f3a' stroke-opacity='0.5'/><ellipse cx='412' cy='445' rx='8' ry='5' fill='#cf3f3a' fill-opacity='0.35'/><ellipse cx='436' cy='459' rx='8' ry='5' fill='#cf3f3a' fill-opacity='0.35'/><text x='40' y='456' font-size='11' fill='#5c5c57'>Blood</text><path d='M24,424 H456' stroke='#a9a9a2' stroke-dasharray='3 3'/><text x='456' y='418' font-size='10' fill='#5c5c57' text-anchor='end'>blood–brain barrier</text><g stroke='#a9a9a2' stroke-width='3' stroke-linecap='round'><path d='M54,250 L30,214 M54,250 L86,222 M54,250 L28,292 M54,250 L88,286'/></g><circle cx='54' cy='250' r='20' fill='#f2f1ed' stroke='#a9a9a2'/><text x='54' y='334' font-size='10' fill='#5c5c57' text-anchor='middle'>Astrocyte</text><path d='M100,220 V150 Q100,96 170,96 H330 Q400,96 400,150 V220 Z' fill='#f2f1ed' stroke='#a9a9a2'/><text x='114' y='116' font-size='10.5' fill='#5c5c57'>Presynaptic terminal</text><path d='M90,262 H410 V330 Q410,398 340,398 H160 Q90,398 90,330 Z' fill='#f2f1ed' stroke='#a9a9a2'/><text x='104' y='390' font-size='10.5' fill='#5c5c57'>Postsynaptic neuron</text><text x='456' y='245' font-size='10' fill='#5c5c57' text-anchor='end'>cleft</text><path d='M305,232 v-18 a10,10 0 0 1 20,0 v18 z' stroke='#2f6fdb' stroke-width='1.75' fill='#2f6fdb' fill-opacity='0.16'/><circle cx='306.7' cy='194' r='8' fill='#2f6fdb' stroke='#2f6fdb' stroke-width='1.5'/><text x='306.7' y='197.5' font-size='10' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><text x='318.7' y='198' font-size='10.5' fill='#1d1d1b' font-weight='600'>A1</text><path d='M294,250 v22 a4,4 0 0 0 4,4 h14 a4,4 0 0 0 4,-4 v-22 h-8 v14 h-6 v-14 z' stroke='#2f6fdb' stroke-width='1.75' fill='#2f6fdb' fill-opacity='0.16'/><circle cx='293.55' cy='294' r='8' fill='#2f6fdb' stroke='#2f6fdb' stroke-width='1.5'/><text x='293.55' y='297.5' font-size='10' fill='#ffffff' font-weight='700' text-anchor='middle'>2</text><text x='305.55' y='298' font-size='10.5' fill='#1d1d1b' font-weight='600'>A2A</text><g><circle cx='315' cy='220' r='5.5' fill='#2f6fdb' class='still'/><circle r='5.5' fill='#2f6fdb' opacity='0' class='anim'><animateMotion path='M315,456 C315,396 315,290 315,220' dur='3.6s' begin='0.0s' repeatCount='indefinite'/><animate attributeName='opacity' values='0;1;1;0' keyTimes='0;0.1;0.85;1' dur='3.6s' begin='0.0s' repeatCount='indefinite'/></circle><circle r='5.5' fill='#2f6fdb' opacity='0' class='anim'><animateMotion path='M315,456 C315,396 315,290 315,220' dur='3.6s' begin='1.8s' repeatCount='indefinite'/><animate attributeName='opacity' values='0;1;1;0' keyTimes='0;0.1;0.85;1' dur='3.6s' begin='1.8s' repeatCount='indefinite'/></circle><circle cx='315' cy='220' r='14' fill='none' stroke='#2f6fdb' stroke-width='1.5' opacity='0' class='anim'><animate attributeName='r' values='10;22' dur='1.8s' begin='1.4s' repeatCount='indefinite'/><animate attributeName='opacity' values='0.55;0' dur='1.8s' begin='1.4s' repeatCount='indefinite'/></circle><circle cx='305' cy='262' r='5.5' fill='#2f6fdb' class='still'/><circle r='5.5' fill='#2f6fdb' opacity='0' class='anim'><animateMotion path='M305,456 C305,396 305,332 305,262' dur='3.6s' begin='0.45s' repeatCount='indefinite'/><animate attributeName='opacity' values='0;1;1;0' keyTimes='0;0.1;0.85;1' dur='3.6s' begin='0.45s' repeatCount='indefinite'/></circle><circle r='5.5' fill='#2f6fdb' opacity='0' class='anim'><animateMotion path='M305,456 C305,396 305,332 305,262' dur='3.6s' begin='2.25s' repeatCount='indefinite'/><animate attributeName='opacity' values='0;1;1;0' keyTimes='0;0.1;0.85;1' dur='3.6s' begin='2.25s' repeatCount='indefinite'/></circle><circle cx='305' cy='262' r='14' fill='none' stroke='#2f6fdb' stroke-width='1.5' opacity='0' class='anim'><animate attributeName='r' values='10;22' dur='1.8s' begin='1.85s' repeatCount='indefinite'/><animate attributeName='opacity' values='0.55;0' dur='1.8s' begin='1.85s' repeatCount='indefinite'/></circle></g><text x='484' y='104' font-size='13' fill='#1d1d1b' font-weight='600'>How it acts</text><circle cx='492' cy='122' r='8' fill='#2f6fdb' stroke='#2f6fdb' stroke-width='1.5'/><text x='492' y='125.5' font-size='10' fill='#ffffff' font-weight='700' text-anchor='middle'>1</text><text x='506' y='126' font-size='12' fill='#1d1d1b' font-weight='600'>Adenosine A1 receptor</text><text x='506' y='142' font-size='11.5' fill='#5c5c57'>Blocked: removes presynaptic inhibition</text><text x='506' y='157' font-size='11.5' fill='#5c5c57'>of glutamate and acetylcholine release</text><text x='506' y='172' font-size='10.5' fill='#2f6fdb' font-weight='600'>Established in humans</text><circle cx='492' cy='192' r='8' fill='#2f6fdb' stroke='#2f6fdb' stroke-width='1.5'/><text x='492' y='195.5' font-size='10' fill='#ffffff' font-weight='700' text-anchor='middle'>2</text><text x='506' y='196' font-size='12' fill='#1d1d1b' font-weight='600'>Adenosine A2A receptor</text><text x='506' y='212' font-size='11.5' fill='#5c5c57'>Blocked in striatal A2A–D2 heteromers:</text><text x='506' y='227' font-size='11.5' fill='#5c5c57'>indirect dopaminergic effect</text><text x='506' y='242' font-size='10.5' fill='#2f6fdb' font-weight='600'>Established in humans</text><path d='M484,256 H736' stroke='#a9a9a2'/><text x='484' y='274' font-size='11' fill='#5c5c57'>Enters the brain by passive diffusion</text><text x='484' y='288.5' font-size='11' fill='#5c5c57'>across the blood–brain barrier.</text><text x='484' y='308.0' font-size='11' fill='#5c5c57'>PDE inhibition, ryanodine-receptor and</text><text x='484' y='322.5' font-size='11' fill='#5c5c57'>GABA-A effects need toxic concentrations.</text><text x='484' y='342.0' font-size='11' fill='#5c5c57'>Chronic use upregulates A1 receptors:</text><text x='484' y='356.5' font-size='11' fill='#5c5c57'>partial tolerance and withdrawal.</text></g><g transform='translate(0,0)'><circle cx='30' cy='506' r='5.5' fill='#2f6fdb'/><text x='42' y='510' font-size='11' fill='#5c5c57'>Established in humans</text><circle cx='190' cy='506' r='5.5' fill='#ffffff' stroke='#2f6fdb' stroke-width='1.75'/><text x='202' y='510' font-size='11' fill='#5c5c57'>Established in animals or in vitro</text><circle cx='416' cy='506' r='5.5' fill='#ffffff' stroke='#2f6fdb' stroke-width='1.5' stroke-dasharray='2 2'/><text x='428' y='510' font-size='11' fill='#5c5c57'>Hypothesis</text><text x='24' y='532' font-size='10.5' fill='#5c5c57'>Schematic, not to scale. Molecules travel from the blood to each target. Source: Module 2.1.</text></g></svg>