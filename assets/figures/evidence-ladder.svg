<svg xmlns='http://www.w3.org/2000/svg' font-family='Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif' viewBox='0 0 760 510' role='img' aria-label='No substance reaches A for enhancing rested, healthy adults' font-size='13'><rect x='0' y='0' width='760' height='510' rx='12' fill='#ffffff'/><text x='24' y='30' font-size='15' font-weight='600' fill='#1d1d1b'>No substance reaches A for enhancing rested, healthy adults</text><text x='24' y='50' font-size='11.5' fill='#5c5c57'>Each substance placed by its best rating in any population (Appendix A)</text><g><rect x='24' y='76' width='712' height='72' rx='8' fill='#f2f1ed' stroke='#a9a9a2' stroke-width='1'/><text x='40' y='104' font-size='18' font-weight='600' fill='#1d1d1b'>A</text><text x='64' y='98' font-size='11.5' fill='#5c5c57'><tspan x='64'>Replicated RCTs,</tspan><tspan x='64' dy='15'>low risk of bias</tspan></text><g><rect x='200' y='92' width='73' height='22' rx='11' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='1.5'/><text x='236.5' y='107' text-anchor='middle' font-size='11.5' fill='#1d1d1b'>Caffeine</text></g><g><rect x='281' y='92' width='80' height='22' rx='11' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='1.5'/><text x='321.0' y='107' text-anchor='middle' font-size='11.5' fill='#1d1d1b'>Modafinil</text></g><g><rect x='369' y='92' width='118' height='22' rx='11' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='1.5'/><text x='428.0' y='107' text-anchor='middle' font-size='11.5' fill='#1d1d1b'>Methylphenidate</text></g><text x='200' y='132' font-size='11.5' fill='#5c5c57'>A only when relieving a deficit: fatigue, sleep loss or ADHD</text></g><g><rect x='24' y='158' width='712' height='82' rx='8' fill='none' stroke='#a9a9a2' stroke-width='1'/><text x='40' y='186' font-size='18' font-weight='600' fill='#1d1d1b'>B</text><text x='64' y='180' font-size='11.5' fill='#5c5c57'><tspan x='64'>Several RCTs, limited</tspan><tspan x='64' dy='15'>r